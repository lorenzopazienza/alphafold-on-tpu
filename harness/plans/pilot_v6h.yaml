# Pilot, precision-matched arm V6h (notes/analysis_plan.md, section 11): v6e
# with float32 matmuls at the highest precision (config tpu_xla_highest:
# tpu_xla plus JAX_DEFAULT_MATMUL_PRECISION=highest). The 10 pilot targets,
# seeds 1 and 2, r1 only (one fresh-cache run per seed, no r2, no warm rerun),
# official weights from the private bucket (WEIGHTS=gcs), AlphaFold3's
# defaults, libtpu 0.0.43.2 (the launcher's default stack). Its own session,
# label pilot; analysis/collect.py names the condition V6h from the
# JAX_DEFAULT_MATMUL_PRECISION value recorded in session.json (xla_env).
#
# Sizing (random-weight v6e probe, libtpu 0.0.43.2: 7U3J bucket 256 72 s
# wall, 7D5C bucket 1024 215 s; buckets 512 and 768 interpolated linearly;
# 10 s per process): about 51 min of runs at the default precision, 153 min
# if highest makes them 3 times slower; setup about 3.5 min. Deadline
# 2 x setup + 3 x runs, rounded up to 15 min: 165 min (VM lifetime 195 min).
#
# Format: the YAML subset of harness/configs.yaml, plus inline lists [a, b].

description: pilot with the official weights, precision-matched arm V6h (v6e, highest matmul precision)
label: pilot2
weights: gcs

configs:
  v6e: tpu_xla_highest

targets:
  default: pilot

seeds: [1, 2]
fresh_reps: 1
warm_rerun_seed: none
num_recycles: default
num_diffusion_samples: default
run_timeout_min: 180

deadline_min:
  v6e: 165
