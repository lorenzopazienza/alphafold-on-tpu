# Stack validation (2026-10-09): AlphaFold3 at its defaults (10 recycles,
# 5 diffusion samples) on the proposed TPU stack, jax/jaxlib 0.10.2 with
# libtpu 0.0.43.2 instead of the 0.0.42.1 that jax[tpu]==0.10.2 pins (with
# 0.0.42.1, more than one diffusion sample segfaults while compiling on v5e;
# notes/upstream_v5e_segfault.md). Random weights, seed 1, one fresh-cache
# repetition, 7U3J (205 tokens) and 7D5C (1023 tokens, the 16 GB test on v5e).
#
# v5e: one run on libtpu 0.0.43.2 (on-demand: SPOT=0).
# v6e: the same plan on 0.0.43.2, then on 0.0.42.1, on one VM (Flex-start).
#      The 0.0.42.1 run repeats the existing v6e probe on a new VM: if they are
#      bit-identical, v6e is reproducible across VMs, and a 0.0.43.2 against
#      0.0.42.1 difference is the libtpu change, not noise.
# Both are compared after the fetch with the v6e 0.0.42.1 probe of 2026-10-08
# (harness/compare_runs.py: per sample, bit for bit and by RMSD); fetch with
# FETCH=full or without a results bucket, so the full confidences are local.
#
# Format: the YAML subset of harness/configs.yaml, plus inline lists [a, b].

description: TPU stack validation, jax/jaxlib 0.10.2 with libtpu 0.0.43.2 (v6e also 0.0.42.1)
label: stack
weights: random

configs:
  v5e: tpu_xla
  v6e: tpu_xla

targets:
  default: [7U3J, 7D5C]

seeds: [1]
fresh_reps: 1
warm_rerun_seed: none
num_recycles: default
num_diffusion_samples: default
run_timeout_min: 180

libtpu:
  v5e: [0.0.43.2]
  v6e: [0.0.43.2, 0.0.42.1]

compare_reference:
  default: results/af3/20261008T165218Z_v6e_probe/tpu_xla_rep1_seed1_fresh

# Minutes the laptop follows the run, setup included. v5e: setup about 10 min,
# then 7U3J and 7D5C at 5 samples (1 sample of 7D5C took 130 s). v6e: setup
# plus two stacks of about 5 min each (the 0.0.42.1 probe took 72 s and 215 s).
deadline_min:
  v5e: 90
  v6e: 60
